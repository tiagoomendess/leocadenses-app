<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%" class="%theme.class%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<!-- Filled by hooks.server.ts from the theme cookie (chromeColor in src/lib/theme.ts) -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="%theme.color.light%" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="%theme.color.dark%" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" href="/images/logo.png" />
		<script nonce="%sveltekit.nonce%">
			// Resolve the theme before first paint (no flash). Keep in sync with src/lib/theme.ts.
			(function () {
				var saved = document.cookie.match(/(?:^|; )theme=(light|dark)/);
				var dark = saved
					? saved[1] === 'dark'
					: window.matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.classList.toggle('dark', dark);
				document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
