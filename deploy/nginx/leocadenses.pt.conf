# nginx site for leocadenses.pt (public site and /admin), behind Cloudflare.
#
# Install:
#   sudo cp deploy/nginx/leocadenses.pt.conf /etc/nginx/sites-available/leocadenses.pt
#   sudo ln -s /etc/nginx/sites-available/leocadenses.pt /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/log/nginx/leocadenses.pt
#   (certificate: see "TLS" below), then: sudo nginx -t && sudo systemctl reload nginx
#
# Must match the app's .env: PORT=3005 (proxy_pass), BODY_SIZE_LIMIT=25M (client_max_body_size),
# PROTOCOL_HEADER=x-forwarded-proto and ADDRESS_HEADER=CF-Connecting-IP (proxy headers below).
#
# TLS: Cloudflare connects to this server with SSL mode "Full (strict)", so the origin needs a
# certificate Cloudflare trusts. Either
#   - Let's Encrypt (as below): sudo certbot certonly --webroot -w /var/www/html \
#       -d leocadenses.pt -d www.leocadenses.pt   (port 80 must reach this server for the challenge)
#   - or a Cloudflare Origin Certificate (15 years, no renewals): save it as
#       /etc/ssl/cloudflare/leocadenses.pt.pem and .key and swap the ssl_certificate lines.

# HTTP: ACME challenges, everything else to HTTPS on the canonical host.
server {
    listen 80;
    listen [::]:80;
    server_name leocadenses.pt www.leocadenses.pt;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://leocadenses.pt$request_uri;
    }
}

# www → apex (the old site and its sitemap used https://leocadenses.pt).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.leocadenses.pt;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/leocadenses.pt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leocadenses.pt/privkey.pem;
    # ssl_certificate /etc/ssl/cloudflare/leocadenses.pt.pem;
    # ssl_certificate_key /etc/ssl/cloudflare/leocadenses.pt.key;

    return 301 https://leocadenses.pt$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name leocadenses.pt;

    server_tokens off;

    # Optional hardening: only accept connections from Cloudflare (generate the file with
    # deploy/nginx/update-cloudflare-ips.sh, then uncomment).
    # include /etc/nginx/snippets/cloudflare-allow.conf;

    # The app sets these on the pages it renders (src/hooks.server.ts), but not on the static
    # files adapter-node serves. Hide the app's copies and set them here so every response gets
    # exactly one value. X-Robots-Tag stays the app's (only /admin and /c/... are noindex);
    # the Content-Security-Policy too (vite.config.ts).
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Same as BODY_SIZE_LIMIT in .env (image uploads in the backoffice). Raise both together.
    client_max_body_size 25M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Member cards and image uploads are processed while the request waits.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    access_log /var/log/nginx/leocadenses.pt/access.log;
    error_log /var/log/nginx/leocadenses.pt/error.log;

    ssl_certificate /etc/letsencrypt/live/leocadenses.pt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leocadenses.pt/privkey.pem;
    # ssl_certificate /etc/ssl/cloudflare/leocadenses.pt.pem;
    # ssl_certificate_key /etc/ssl/cloudflare/leocadenses.pt.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";
}
